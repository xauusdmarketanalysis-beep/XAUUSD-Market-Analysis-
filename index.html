<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global FX Trade 2027 - XAUUSD Market Analysis</title>
<style>
  body {
    margin: 0;
    background: #000000;
    color: #ffffff;
    font-family: Arial, sans-serif;
    padding: 15px;
  }
  .card {
    max-width: 380px;
    margin: 30px auto;
    background: #0f0f0f;
    border: 2px solid #FFD700;
    border-radius: 26px;
    padding: 24px;
    text-align: center;
    box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
  }
  .logo {
    width: 125px;
    height: 125px;
    border-radius: 50%;
    border: 3px solid #FFD700;
    object-fit: cover;
    display: block;
    margin: 0 auto;
    background: #111;
  }
  h2 {
    color: #FFD700;
    margin: 16px 0 8px 0;
    font-size: 26px;
  }
  .sub-box {
    background: #151515;
    border-left: 4px solid #FFD700;
    border-radius: 12px;
    padding: 14px;
    text-align: left;
    margin: 18px 0;
    font-size: 14px;
    line-height: 20px;
    color: #dddddd;
  }
  .btn {
    display: block;
    padding: 17px;
    border-radius: 14px;
    font-weight: bold;
    margin: 12px 0;
    text-decoration: none;
    text-align: center;
    font-size: 17px;
  }
  .gold-btn {
    background: linear-gradient(90deg, #FFD700, #ffae00);
    color: #000000;
  }
  .dark-btn {
    background: #1e1e1e;
    color: #FFD700;
    border: 1.5px solid #FFD700;
  }
  .footer {
    font-size: 11px;
    color: #777;
    margin-top: 18px;
  }
</style>
</head>
<body>
  <div class="card">
    <!-- Aapki tasveer gol ke andar -->
    <img src="logo.jpg" alt="Global Forex Trading" class="logo">

    <h2>Global FX Trade 2027 👑</h2>

    <!-- Aapke wahi alfaz -->
    <div class="sub-box">
      <b style="color:#FFD700;">XAUUSD — Market Analysis</b><br>
      Entry, TP and SL levels may be provided for educational analysis.
    </div>

    <!-- Ab dono button seedha aapke channel par jayenge, Bot par nahi -->
    <a href="https://t.me/GlobalFXTrade_2027" class="btn gold-btn">🚀 Join My Channel</a>
    <a href="https://t.me/GlobalFXTrade_2027" class="btn dark-btn">📊 Join VIP Channel</a>

    <div class="footer">
      Educational Purpose Only - Not Financial Advice<br>
      ⭐ Trusted by 5000+ Traders
    </div>
  </div>
</body>
</html>
