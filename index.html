        /* بٹن سیکشن */
        .btn { 
            display: block; 
            width: 90%; 
            max-width: 350px; 
            margin: 15px auto; 
            padding: 18px; 
            background: #FFD700; 
            color: #000; 
            text-decoration: none; 
            font-weight: bold; 
            border-radius: 12px; 
            font-size: 18px;
            transition: 0.3s;
        }
        .btn:hover { 
            background: #FFFFFF; 
            transform: scale(1.03);
        }
        .btn-2 {
            background: transparent;
            border: 2px solid #FFD700;
            color: #FFD700;
        }
        .btn-2:hover {
            background: #FFD700;
            color: #000;
        }
        
        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #666;
