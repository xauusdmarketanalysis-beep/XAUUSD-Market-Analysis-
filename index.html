<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XAUUSD Market Analysis</title>
<style>
body{margin:0;background:#070707;color:#fff;font-family:sans-serif;text-align:center}
.box{max-width:450px;margin:auto;padding:20px}
.logo{width:120px;height:120px;border-radius:50%;border:3px solid gold;margin-top:25px;object-fit:cover}
h1{color:#FFD700;margin:15px 0 5px;font-size:26px}
.sub{color:#aaa;margin-bottom:20px}
.card{background:#151515;border:1px solid #222;border-radius:15px;padding:20px;margin:20px 0}
.btn{display:block;width:100%;padding:15px;border-radius:12px;text-decoration:none;font-weight:bold;font-size:16px;margin:10px 0;box-sizing:border-box}
.gold{background:linear-gradient(90deg,#D4AF37,#FFD700);color:#000}
.dark{background:#222;color:#fff;border:1px solid #333}
.votes{display:flex;gap:10px;margin-top:10px}
.votes button{flex:1;padding:14px;border-radius:10px;border:none;font-weight:bold;font-size:15px;color:#fff;cursor:pointer}
.buy{background:#00c853} .sell{background:#d50000}
</style>
</head>
<body>
<div class="box">
<img src="https://i.imgur.com/8Km9tLL.jpg" class="logo">
<h1>XAUUSD Market Analysis</h1>
<p class="sub">Premium Gold Signals | 90% Accuracy</p>

<div class="card">
<h3 style="color:gold;margin:0 0 10px">🏆 TODAY GOLD POLL</h3>
<p style="margin:0 0 10px">Gold aaj kya karega? Vote karo!</p>
<div class="votes">
<button class="buy" onclick="vote('buy')">BUY 👍 <span id="b">0</span></button>
<button class="sell" onclick="vote('sell')">SELL 👎 <span id="s">0</span></button>
</div>
</div>

<a class="btn gold" href="https://t.me/xauusdmarketanalysis" target="_blank">📈 JOIN TELEGRAM CHANNEL</a>
<button class="btn dark" onclick="sharePage()">🔗 PROFILE SHARE KARO</button>

<p style="color:#555;font-size:11px;margin-top:30px">© 2026 XAUUSD Market Analysis</p>
</div>

<script>
let buy=0,sell=0;
function vote(t){
 if(t=='buy'){buy++;document.getElementById('b').innerText=buy}
 else{sell++;document.getElementById('s').innerText=sell}
}
function sharePage(){
 let link = window.location.href;
 navigator.clipboard.writeText(link);
 alert("Link Copy Ho Gaya: " + link + "\nAb isko Telegram par Ad ki tarah share karo!");
}
</script>
</body>
</html>
