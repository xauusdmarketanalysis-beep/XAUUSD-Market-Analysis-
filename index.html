<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global FX Trading 72</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;background:#080808;color:white;font-family:Arial;text-align:center;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{width:90%;max-width:400px;background:#151515;padding:25px;border-radius:20px;border:1px solid #333}
.logo{width:120px;height:120px;border-radius:50%;border:3px solid gold;object-fit:cover}
h1{color:gold;margin:15px 0 5px}
p{color:#aaa;font-size:14px}
.btn{display:block;padding:16px;margin:12px 0;border-radius:12px;text-decoration:none;font-weight:bold;font-size:17px}
.gold{background:linear-gradient(90deg,#D4AF37,#FFD700);color:black}
.blue{background:#0088cc;color:white}
</style>
</head>
<body>
<div class="box">
<img src="logo.jpg" class="logo">
<h1>Global FX Trading 72</h1>
<p>Official Bot & Channel</p>

<a class="btn gold" onclick="goChannel()">🚀 Launch App - Join Channel</a>
<a class="btn blue" href="https://t.me/GlobalFXTrading_72">📈 Direct Join Channel</a>
<a class="btn blue" href="https://t.me/RajeshFx_33bot">🤖 @RajeshFx_33bot</a>

<p style="font-size:11px;color:#555;margin-top:15px">Bot: @RajeshFx_33bot | Channel: GlobalFXTrading_72</p>
</div>

<script>
// Bot Launch System - Through to Channel
function goChannel(){
  var channel = "https://t.me/GlobalFXTrading_72";
  if(window.Telegram && window.Telegram.WebApp){
    Telegram.WebApp.openTelegramLink(channel);
  } else {
    window.location.href = channel;
  }
}
if(window.Telegram && window.Telegram.WebApp){
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
}
</script>
</body>
</html>
